<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTRAHOT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030305;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);opacity:.9}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 5px #fff}
#crosshair:before{width:2px;height:14px;left:6px}#crosshair:after{height:2px;width:14px;top:6px}
#prompt{position:absolute;left:50%;top:65%;transform:translateX(-50%);font-size:13px;letter-spacing:2px;text-shadow:0 2px 8px #000;display:none}
#title{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) scale(.72);font-weight:1000;font-style:italic;font-size:clamp(48px,10vw,130px);letter-spacing:.04em;color:#fff;text-shadow:0 0 10px #fff,0 0 36px #f22;opacity:0;white-space:nowrap}
#sub{position:absolute;left:50%;top:42%;transform:translateX(-50%);font-size:12px;letter-spacing:8px;opacity:0}
#help{position:absolute;left:22px;bottom:18px;color:#ddd;font-size:12px;line-height:1.7;text-shadow:0 2px 5px #000;opacity:.75}
#status{position:absolute;right:22px;bottom:18px;font-weight:900;font-size:24px;text-align:right;text-shadow:0 2px 5px #000}
#status small{display:block;font-size:10px;letter-spacing:3px;color:#f44}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.65) 100%);pointer-events:none}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#020204;z-index:5;cursor:pointer}
#start div{text-align:center;max-width:560px;padding:30px}
#start strong{font-size:clamp(36px,8vw,80px);font-weight:1000;font-style:italic;letter-spacing:3px}
#start p{font-size:12px;letter-spacing:3px;color:#aaa;line-height:2}
#start button{margin-top:22px;border:1px solid #aaa;background:transparent;color:white;padding:14px 26px;letter-spacing:4px;cursor:pointer}
#start button:hover{background:#fff;color:#000}
#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="start"><div><strong>...</strong><p>UM LUGAR ESQUECIDO.<br>UMA ARMA ESPERANDO NO ESCURO.</p><button id="begin">ENTRAR</button><p>WASD · MOVER &nbsp; MOUSE · OLHAR<br>E · INTERAGIR &nbsp; CLIQUE · ATIRAR</p></div></div>
<div id="hud"><div id="crosshair"></div><div id="prompt"></div><div id="title">ULTRAHOT</div><div id="sub">MANKIND IS A FAILURE</div><div id="help">WASD — MOVER<br>ESPAÇO — PULAR · SHIFT — CORRER<br>E — PEGAR REVÓLVER · CLIQUE — ATIRAR</div><div id="status">0<small>ALVOS ELIMINADOS</small></div><div id="vignette"></div><div id="flash"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { createRevolver } from './modelos/revolver.js';
import { createCreature } from './modelos/criatura.js';
import { animateCreature } from './modelos/animacoes.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020205);
scene.fog = new THREE.FogExp2(0x030307, 0.055);
const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, .05, 160);
camera.rotation.order='YXZ';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.72;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(0x34394b,0x08070b,.18); scene.add(ambient);
const keyLight = new THREE.PointLight(0x68728a,1.2,17,2); keyLight.position.set(0,2.7,1); scene.add(keyLight);
const redLight = new THREE.PointLight(0xb10c18,1.4,12,2); redLight.position.set(0,2,-12); scene.add(redLight);
const worldLight = new THREE.DirectionalLight(0xffffff,0); worldLight.position.set(-5,10,2); worldLight.castShadow=true; scene.add(worldLight);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const concrete=mat(0x282a30,.94), dark=mat(0x101116,.95), metal=mat(0x444851,.42,.75), rust=mat(0x57252a,.7,.3), strip=mat(0x9d111b,.35,.35), emissive= new THREE.MeshStandardMaterial({color:0x4b080b,emissive:0x6b0005,emissiveIntensity:.8});
function box(w,h,d,material,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(rt,rb,h,material,x,y,z,parent=scene,seg=12){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function lightFixture(x,y,z,color=0x8a9abb){const l=new THREE.PointLight(color,.22,7,2);l.position.set(x,y,z);scene.add(l);box(.75,.08,.24,metal,x,y,z);const glow=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.65});box(.55,.025,.12,glow,x,y-.05,z)}
// Tunnel corridor, intentionally very dark at first.
box(9,.5,100,concrete,0,-.35,-30); box(9,.5,100,dark,0,5.2,-30);
box(.45,5.5,100,concrete,-4.4,2.2,-30); box(.45,5.5,100,concrete,4.4,2.2,-30);
for(let z=14;z>-79;z-=4){
  box(9,.24,.35,metal,0,4.9,z);
  box(.18,5.1,.22,dark,-4,2.1,z);box(.18,5.1,.22,dark,4,2.1,z);
  if(z%8===2){box(.18,.025,2,strip,-3.95,.02,z);box(.18,.025,2,strip,3.95,.02,z)}
  if(z<1) { if(Math.abs(z)%12===0) lightFixture(0,4.3,z,0x66718a); }
}
for(let z=12;z>-75;z-=8){box(.16,.02,3,metal,-2,.005,z);box(.16,.02,3,metal,2,.005,z)}
// Side machinery, pipes and recessed panels.
for(let side of [-1,1]) for(let z=8;z>-65;z-=7){
  box(.22,1.5,1.2,dark,side*3.98,1.0,z);
  box(.07,1.15,.75,metal,side*3.82,1.0,z);
  cylinder(.07,.07,3,metal,side*3.5,3,z,scene,8).rotation.x=Math.PI/2;
  box(.06,.55,.06,strip,side*3.77,1,z-.2);
}
const stand = new THREE.Group(); stand.position.set(0,0,-2.8); scene.add(stand);
cylinder(.65,.78,.24,metal,0,.12,0,stand,16); cylinder(.48,.6,.18,dark,0,.32,0,stand,16);
box(.7,.08,.5,metal,0,.46,0,stand); box(.12,.42,.12,metal,0,.68,0,stand);
box(.48,.06,.42,rust,0,.91,0,stand);
const weapon = createRevolver(); weapon.position.set(.0,1.14,0); weapon.rotation.set(.05,Math.PI,0); stand.add(weapon);
const pickupHalo = new THREE.Mesh(new THREE.TorusGeometry(.42,.025,6,32),new THREE.MeshBasicMaterial({color:0x9b1820}));
pickupHalo.rotation.x=Math.PI/2; pickupHalo.position.set(0,1.18,0); stand.add(pickupHalo);
const pedestalLamp = new THREE.PointLight(0x6f0b13,.35,4); pedestalLamp.position.set(0,1.7,-2.8);scene.add(pedestalLamp);
// Door to combat hall and far arena.
box(8,4.8,.3,dark,0,2.1,-10); box(6.9,4,.2,metal,0,2,-10.2); box(6.2,3.5,.12,dark,0,1.8,-10.05);
for(let side of [-1,1]) box(.12,4,.12,emissive,side*3.25,2,-10);
for(let z=-17;z>-65;z-=7) {box(8,.08,.08,strip,0,.1,z);}
// combat lights and distant chamber, all lights off until pickup.
const chamberLights=[];
for(let x of [-3,0,3]) for(let z of [-38,-50,-62]){
  const l=new THREE.PointLight(x===0?0xffd9cf:0xff2638,0,18,2);l.position.set(x,3.8,z);scene.add(l);chamberLights.push(l);
}
box(18,.5,30,concrete,0,-.35,-51);box(18,.5,30,dark,0,6,-51);
box(.5,6,30,concrete,-9,2.7,-51);box(.5,6,30,concrete,9,2.7,-51);
for(let x=-8;x<=8;x+=2){box(.06,5,.08,metal,x,2.7,-66);box(.4,.06,.4,strip,x,.05,-51)}
// Scattered rubble for depth.
for(let i=0;i<42;i++){let x=(Math.random()-.5)*7.2,z=5-Math.random()*68,s=.12+Math.random()*.35;const b=box(s,s*.5,s, i%3?dark:concrete,x,s*.25,z);b.rotation.y=Math.random()*3;b.rotation.z=Math.random()*.5}
// Player state
const player={pos:new THREE.Vector3(0,1.7,8),vel:new THREE.Vector3(),yaw:0,pitch:0,grounded:true,weapon:false,health:100};
camera.position.copy(player.pos);
let locked=false, started=false, powered=false, combat=false, kills=0, introTime=0, shootCooldown=0, punchTime=0, dashCooldown=0, jump=false;
const keys={}; const enemies=[]; const projectiles=[]; const effects=[];
const prompt=document.querySelector('#prompt'), title=document.querySelector('#title'), sub=document.querySelector('#sub'), flash=document.querySelector('#flash');
function makeEnemy(x,z){const e=createCreature();e.group.position.set(x,0,z);scene.add(e.group);e.phase=Math.random()*6.28;e.hp=3;e.attack=1+Math.random()*2;e.speed=.65+Math.random()*.35;e.hit=0;enemies.push(e)}
function activateLights(){
  powered=true;scene.background.set(0x15151a);scene.fog.color.set(0x18171b);scene.fog.density=.012;
  ambient.intensity=1.15;keyLight.intensity=2.2;redLight.intensity=3.2;worldLight.intensity=1.7;renderer.toneMappingExposure=1.18;
  chamberLights.forEach((l,i)=>{l.intensity=i%3===1?4.2:2.8});
  scene.traverse(o=>{if(o.isPointLight && o!==keyLight && o!==redLight && !chamberLights.includes(o) && o!==pedestalLamp) o.intensity=Math.max(o.intensity,1.1)});
  flash.style.transition='opacity .12s';flash.style.opacity='.95';setTimeout(()=>{flash.style.transition='opacity 1.2s';flash.style.opacity='0'},100);
  title.animate([{opacity:0,transform:'translate(-50%,-50%) scale(1.8)',filter:'blur(12px)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)',filter:'blur(0px)'},{opacity:1,offset:.7},{opacity:0,transform:'translate(-50%,-50%) scale(.94)'}],{duration:3000,easing:'cubic-bezier(.16,1,.3,1)'});
  sub.animate([{opacity:0,letterSpacing:'18px'},{opacity:.85,letterSpacing:'8px',offset:.3},{opacity:0}],{duration:3000});
  combat=true;for(let i=0;i<7;i++)makeEnemy((Math.random()-.5)*12,-30-Math.random()*31);
  document.querySelector('#status').style.color='#ff343e';
}
function pickup(){if(player.weapon)return;player.weapon=true;stand.remove(weapon);camera.add(weapon);weapon.position.set(.32,-.28,-.62);weapon.rotation.set(0,Math.PI,0);weapon.scale.setScalar(.85);scene.add(camera);activateLights();prompt.style.display='none';}
function start(){started=true;document.querySelector('#start').style.display='none';renderer.domElement.requestPointerLock?.();camera.position.copy(player.pos)}
document.querySelector('#begin').addEventListener('click',start);
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
renderer.domElement.addEventListener('click',()=>{if(started&&!locked)renderer.domElement.requestPointerLock?.();else if(locked)shoot()});
document.addEventListener('mousemove',e=>{if(!locked)return;player.yaw-=e.movementX*.0021;player.pitch-=e.movementY*.0018;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch))});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&started&&!player.weapon){if(player.pos.distanceTo(new THREE.Vector3(0,1,-2.8))<3.5)pickup()}if(e.code==='Space'&&player.grounded){player.vel.y=6.5;player.grounded=false}if(e.code==='ShiftLeft'&&dashCooldown<=0){const d=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));player.vel.addScaledVector(d,8);dashCooldown=.8}if(e.code==='KeyF'&&player.weapon)punch()});
document.addEventListener('keyup',e=>keys[e.code]=false);
function shoot(){if(!player.weapon||shootCooldown>0||!combat)return;shootCooldown=.19;weapon.position.z=-.55;weapon.position.y=-.25;const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation).normalize();const ray=new THREE.Raycaster(camera.position,dir,0,70);let hitEnemy=null,dist=70;for(const e of enemies){if(e.hp<=0)continue;const parts=[];e.group.traverse(o=>{if(o.isMesh)parts.push(o)});const hits=ray.intersectObjects(parts,false);if(hits.length&&hits[0].distance<dist){dist=hits[0].distance;hitEnemy=e}}if(hitEnemy){hitEnemy.hp--;hitEnemy.hit=.18;hitEnemy.group.position.addScaledVector(dir,.22);if(hitEnemy.hp<=0){hitEnemy.dead=true;kills++;document.querySelector('#status').innerHTML=`${kills}<small>ALVOS ELIMINADOS</small>`;for(let i=0;i<10;i++)spawnSpark(hitEnemy.group.position.clone().add(new THREE.Vector3(0,1,0)),0xff2536)}}}
function punch(){punchTime=.22;const dir=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));for(const e of enemies){if(e.hp<=0)continue;const p=e.group.position.clone().sub(player.pos);if(p.length()<2.6&&p.normalize().dot(dir)>.25){e.hp-=2;e.hit=.25;e.group.position.addScaledVector(dir,1.4);if(e.hp<=0){e.dead=true;kills++;document.querySelector('#status').innerHTML=`${kills}<small>ALVOS ELIMINADOS</small>`}}}}
function spawnSpark(pos,color){const m=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);scene.add(m);effects.push({mesh:m,life:.5,vel:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5)})}
const clock=new THREE.Clock();
function update(dt){
  shootCooldown=Math.max(0,shootCooldown-dt);punchTime=Math.max(0,punchTime-dt);dashCooldown=Math.max(0,dashCooldown-dt);
  pickupHalo.rotation.z+=dt*.8;pickupHalo.position.y=1.18+Math.sin(performance.now()*.002)*.05;
  if(!started)return;
  if(!player.weapon){const near=player.pos.distanceTo(new THREE.Vector3(0,1,-2.8))<3.3;prompt.style.display=near?'block':'none';prompt.textContent=near?'[ E ]  PEGAR REVÓLVER':'';}
  if(locked){
    camera.rotation.set(player.pitch,player.yaw,0,'YXZ');
    const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
    let move=new THREE.Vector3();if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(move.lengthSq())move.normalize();
    const speed=keys.ShiftLeft?8.5:4.8;player.vel.x=THREE.MathUtils.damp(player.vel.x,move.x*speed,12,dt);player.vel.z=THREE.MathUtils.damp(player.vel.z,move.z*speed,12,dt);
    player.vel.y-=18*dt;player.pos.addScaledVector(player.vel,dt);if(player.pos.y<1.7){player.pos.y=1.7;player.vel.y=0;player.grounded=true}
    player.pos.x=THREE.MathUtils.clamp(player.pos.x,-3.65,3.65);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-70,12);
    camera.position.copy(player.pos);
    if(player.weapon){weapon.position.x=THREE.MathUtils.damp(weapon.position.x,.32,12,dt);weapon.position.y=THREE.MathUtils.damp(weapon.position.y,punchTime>0?-.18:-.28,18,dt);weapon.position.z=THREE.MathUtils.damp(weapon.position.z,punchTime>0?-.48:-.62,18,dt);weapon.rotation.x=THREE.MathUtils.damp(weapon.rotation.x,punchTime>0?-.5:0,15,dt)}
  }
  if(combat) for(const e of enemies){if(e.hp<=0){e.group.visible=false;continue}e.phase+=dt*(1.5+e.speed);animateCreature(e,dt,player.pos);const p=player.pos.clone().sub(e.group.position);const d=p.length();if(d>1.6){e.group.position.x+=p.x/d*e.speed*dt;e.group.position.z+=p.z/d*e.speed*dt}e.group.position.x=THREE.MathUtils.clamp(e.group.position.x,-7.5,7.5);if(e.hit>0){e.hit-=dt;e.group.scale.setScalar(1+Math.sin(e.hit*60)*.08)}else e.group.scale.setScalar(1);e.attack-=dt;if(d<1.7&&e.attack<0){player.health-=8;e.attack=1.2;if(player.health<=0){player.health=100;player.pos.set(0,1.7,8)}}}
  for(let i=effects.length-1;i>=0;i--){const p=effects[i];p.life-=dt;p.mesh.position.addScaledVector(p.vel,dt);p.vel.y-=8*dt;if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();effects.splice(i,1)}}
}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera)}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
